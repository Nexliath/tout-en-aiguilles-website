<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs — Admin Tout en Aiguilles</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .sort-btn {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; font-size: .78rem; cursor: pointer; color: var(--text-light);
      transition: all .15s; white-space: nowrap;
    }
    .sort-btn:hover, .sort-btn.active { background: var(--rose-pale); color: var(--rose-dark); border-color: var(--rose-dark); }
    .sort-btn.active::after { content: ' ↕'; }
    .sort-btn.asc::after  { content: ' ↑'; }
    .sort-btn.desc::after { content: ' ↓'; }
    .filter-chip {
      background: var(--cream); border: 1px solid var(--border); border-radius: 20px;
      padding: 4px 12px; font-size: .78rem; cursor: pointer; color: var(--text-light); transition: all .15s;
    }
    .filter-chip.active { background: var(--rose-pale); color: var(--rose-dark); border-color: var(--rose-dark); font-weight: 600; }
    .user-avatar-sm {
      width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--border); flex-shrink: 0;
    }
    .user-avatar-initials {
      width: 34px; height: 34px; border-radius: 50%; background: var(--rose-pale);
      color: var(--rose-dark); display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; flex-shrink: 0; border: 2px solid var(--border);
    }
  </style>
</head>
<body>
<div id="admin-guard" style="display:none;position:fixed;inset:0;background:var(--cream);z-index:9999;align-items:center;justify-content:center">
  <div style="background:white;border-radius:24px;padding:40px;max-width:400px;width:90%;box-shadow:0 8px 40px rgba(122,92,72,.15)">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:3rem;margin-bottom:12px">🔐</div>
      <h2 style="margin-bottom:8px">Espace admin</h2>
      <p style="font-size:.875rem;color:var(--text-light)">Connectez-vous avec votre compte administrateur.</p>
    </div>
    <div class="form-group"><label class="form-label">Email</label><input type="email" id="guard-email" class="form-input" placeholder="victorine@..."></div>
    <div class="form-group"><label class="form-label">Mot de passe</label><input type="password" id="guard-password" class="form-input" placeholder="••••••••"></div>
    <p style="text-align:right;margin:-8px 0 12px"><a href="#" onclick="openAdminForgotPassword();return false;" style="font-size:.8rem;color:var(--text-light)">Mot de passe oublié ?</a></p>
    <div id="guard-error" style="display:none;color:#d9534f;font-size:.85rem;margin-bottom:12px;padding:8px 12px;background:#f8d7da;border-radius:8px"></div>
    <button id="guard-btn" class="btn btn-primary btn-block">Se connecter →</button>
  </div>
</div>

<div id="admin-content" class="admin-layout">
  <div id="admin-sidebar-mount"></div>

  <!-- Main -->
  <main class="admin-main">
    <div class="admin-header">
      <h1>👥 Utilisateurs</h1>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="user-count" style="font-size:.85rem;color:var(--text-light)"></div>
        <button class="btn btn-secondary btn-sm" onclick="exportXLS()" title="Exporter la liste filtrée au format Excel">
          📥 Export XLS
        </button>
      </div>
    </div>

    <!-- Panneau historique de commandes -->
    <div id="user-orders-panel" style="display:none" class="admin-panel mb-lg">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div>
          <div class="admin-panel-title" id="user-orders-title" style="margin:0;padding:0;border:none">Commandes</div>
          <div id="user-orders-summary" style="font-size:.82rem;color:var(--text-light);margin-top:4px"></div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('user-orders-panel').style.display='none'">✕ Fermer</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Commande</th><th>Articles</th><th>Total</th><th>Statut</th><th>Date</th></tr></thead>
          <tbody id="user-orders-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="admin-panel">
      <!-- ── Barre de contrôles ── -->
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px">

        <!-- Recherche -->
        <input type="text" id="search-input" class="form-input"
          placeholder="🔍 Nom, pseudo, email…"
          style="max-width:220px;padding:7px 12px;font-size:.875rem;flex-shrink:0">

        <!-- Filtres rôle -->
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="filter-chip active" data-filter="role" data-val="">Tous les rôles</button>
          <button class="filter-chip" data-filter="role" data-val="admin">🛡️ Admins</button>
          <button class="filter-chip" data-filter="role" data-val="user">👤 Utilisateurs</button>
        </div>

        <!-- Filtres statut email -->
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="filter-chip active" data-filter="email" data-val="">Tous statuts</button>
          <button class="filter-chip" data-filter="email" data-val="1">✅ Vérifiés</button>
          <button class="filter-chip" data-filter="email" data-val="0">⏳ En attente</button>
        </div>
      </div>

      <!-- ── Tri ── -->
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
        <span style="font-size:.78rem;color:var(--text-light);font-weight:600;margin-right:4px">Trier :</span>
        <button class="sort-btn desc active" data-sort="date">📅 Inscription</button>
        <button class="sort-btn" data-sort="name">👤 Nom A→Z</button>
        <button class="sort-btn" data-sort="role">🛡️ Rôle</button>
        <button class="sort-btn" data-sort="email_status">✅ Statut email</button>
        <span id="results-label" style="margin-left:auto;font-size:.8rem;color:var(--text-light)"></span>
      </div>

      <!-- ── Tableau ── -->
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Utilisateur</th>
              <th>Pseudo</th>
              <th>Email</th>
              <th>Statut email</th>
              <th>Rôle</th>
              <th>Inscrit le</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-body">
            <tr><td colspan="8" style="text-align:center;padding:24px"><div class="spinner" style="margin:0 auto"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal confirmation suppression -->
<div id="delete-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center">
  <div style="background:white;border-radius:16px;padding:32px;max-width:380px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.2)">
    <h3 style="margin:0 0 12px">Supprimer ce compte ?</h3>
    <p id="delete-modal-text" style="color:var(--text-light);margin:0 0 24px;font-size:.9rem"></p>
    <div style="display:flex;gap:12px">
      <button class="btn btn-secondary" onclick="closeDeleteModal()">Annuler</button>
      <button id="delete-confirm-btn" class="btn" style="background:#d9534f;color:white">Supprimer</button>
    </div>
  </div>
</div>

<script src="/assets/js/main.js"></script>
<script>
let allUsers = [];
let deleteTarget = null;
let sortState = { key: 'date', dir: 'desc' };
let filterRole = '';
let filterEmail = '';

// ─── Auth guard ───────────────────────────────────────────
function checkAdmin() {
  const guard   = document.getElementById('admin-guard');
  const content = document.getElementById('admin-content');
  if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
    content.style.display = 'none';
    guard.style.display   = 'flex';
  } else {
    guard.style.display   = 'none';
    content.style.display = '';
    loadUsers();
  }
}

document.getElementById('guard-btn').addEventListener('click', function() {
  var email    = document.getElementById('guard-email').value.trim();
  var password = document.getElementById('guard-password').value;
  var errEl    = document.getElementById('guard-error');
  var btn      = document.getElementById('guard-btn');
  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'Email et mot de passe requis'; errEl.style.display = ''; return; }
  btn.disabled = true; btn.textContent = '…';
  apiFetch('/auth/login', { method: 'POST', body: { email, password } })
    .then(data => {
      if (data.user.role !== 'admin') throw new Error('Ce compte n\'est pas administrateur.');
      Auth.save(data.token, data.user);
      checkAdmin();
    })
    .catch(e => {
      errEl.textContent = e.message; errEl.style.display = '';
      btn.disabled = false; btn.textContent = 'Se connecter →';
    });
});
document.getElementById('guard-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('guard-btn').click();
});

// ─── Chargement ───────────────────────────────────────────
async function loadUsers() {
  try {
    allUsers = await apiFetch('/admin/users');
    document.getElementById('user-count').textContent = `${allUsers.length} compte${allUsers.length > 1 ? 's' : ''}`;
    applyFiltersAndSort();
  } catch (e) {
    document.getElementById('users-body').innerHTML =
      `<tr><td colspan="8" style="text-align:center;color:#d9534f;padding:24px">Erreur : ${e.message}</td></tr>`;
  }
}

// ─── Filtres + tri ────────────────────────────────────────
function applyFiltersAndSort() {
  const q = document.getElementById('search-input').value.toLowerCase();

  let list = allUsers.filter(u => {
    const matchSearch = !q
      || u.first_name.toLowerCase().includes(q)
      || u.last_name.toLowerCase().includes(q)
      || u.email.toLowerCase().includes(q)
      || (u.username || '').toLowerCase().includes(q);
    const matchRole  = !filterRole  || u.role === filterRole;
    const matchEmail = filterEmail === '' || String(u.email_verified) === filterEmail;
    return matchSearch && matchRole && matchEmail;
  });

  // Tri
  list = list.sort((a, b) => {
    let va, vb;
    if (sortState.key === 'date')  { va = new Date(a.created_at); vb = new Date(b.created_at); }
    if (sortState.key === 'name')  { va = (a.last_name + a.first_name).toLowerCase(); vb = (b.last_name + b.first_name).toLowerCase(); }
    if (sortState.key === 'role')  { va = a.role; vb = b.role; }
    if (sortState.key === 'email_status') { va = a.email_verified; vb = b.email_verified; }
    if (va < vb) return sortState.dir === 'asc' ? -1 : 1;
    if (va > vb) return sortState.dir === 'asc' ? 1 : -1;
    return 0;
  });

  document.getElementById('results-label').textContent = `${list.length} résultat${list.length > 1 ? 's' : ''}`;
  renderUsers(list);
}

// ─── Rendu tableau ────────────────────────────────────────
function renderUsers(users) {
  const me = Auth.getUser();
  const tbody = document.getElementById('users-body');
  if (!users.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-light);padding:32px">Aucun utilisateur trouvé</td></tr>';
    return;
  }
  tbody.innerHTML = users.map(u => {
    const initials = `${u.first_name[0]}${u.last_name[0]}`.toUpperCase();
    const avatarHtml = u.avatar_url
      ? `<img src="${u.avatar_url}" class="user-avatar-sm" alt="${initials}">`
      : `<div class="user-avatar-initials">${initials}</div>`;

    return `
    <tr id="user-row-${u.id}">
      <td style="color:var(--text-light);font-size:.8rem">#${u.id}</td>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          ${avatarHtml}
          <div>
            <div style="font-weight:600;font-size:.9rem">${u.first_name} ${u.last_name}${u.id === me?.id ? ' <span style="font-size:.7rem;color:var(--rose-dark)">(vous)</span>' : ''}</div>
          </div>
        </div>
      </td>
      <td style="font-size:.85rem;color:${u.username ? 'var(--text)' : 'var(--text-light)'}">
        ${u.username ? `<span style="background:var(--cream);border-radius:20px;padding:2px 10px;font-size:.8rem">@${u.username}</span>` : '<span style="font-size:.78rem">—</span>'}
      </td>
      <td style="font-size:.85rem">${u.email}</td>
      <td>
        ${u.email_verified
          ? '<span style="color:#5a9e6f;font-size:.8rem;font-weight:600">✅ Vérifié</span>'
          : '<span style="color:#c8937a;font-size:.8rem;font-weight:600">⏳ En attente</span>'}
      </td>
      <td>
        <span class="order-status ${u.role === 'admin' ? 'status-paid' : 'status-pending'}" style="font-size:.75rem">
          ${u.role === 'admin' ? '🛡️ Admin' : '👤 Utilisateur'}
        </span>
      </td>
      <td style="font-size:.8rem;color:var(--text-light)">${formatDate(u.created_at)}</td>
      <td>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="showUserOrders(${u.id}, '${(u.email || '').replace(/'/g,"\\'")}', '${u.first_name} ${u.last_name}')">📦 Commandes</button>
          ${u.id !== me?.id ? `
            ${u.role === 'admin'
              ? `<button class="btn btn-secondary btn-sm" onclick="changeRole(${u.id}, 'user')">Rétrograder</button>`
              : `<button class="btn btn-primary btn-sm" onclick="changeRole(${u.id}, 'admin')">Promouvoir admin</button>`}
            <button class="btn btn-sm" style="background:#f8d7da;color:#d9534f;border:none" onclick="confirmDelete(${u.id}, '${u.first_name} ${u.last_name}')">🗑️</button>
          ` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ─── Historique de commandes d'un client ──────────────────
let _ordersCache = null;
const ORDER_STATUS_LABELS = { pending:'En attente', paid:'Payée', shipped:'Expédiée', delivered:'Livrée', cancelled:'Annulée' };

async function showUserOrders(userId, email, name) {
  const panel = document.getElementById('user-orders-panel');
  const tbody = document.getElementById('user-orders-tbody');
  document.getElementById('user-orders-title').textContent = `Commandes de ${name}`;
  document.getElementById('user-orders-summary').textContent = 'Chargement…';
  panel.style.display = '';
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px"><div class="spinner" style="margin:0 auto"></div></td></tr>';
  panel.scrollIntoView({ behavior: 'smooth' });

  try {
    if (!_ordersCache) _ordersCache = await apiFetch('/orders');
    const userOrders = _ordersCache.filter(o => o.user_id === userId || (email && o.email?.toLowerCase() === email.toLowerCase()));
    const paidOrders = userOrders.filter(o => ['paid', 'shipped', 'delivered'].includes(o.status));
    const totalSpent = paidOrders.reduce((s, o) => s + Number(o.total), 0);
    document.getElementById('user-orders-summary').textContent =
      `${userOrders.length} commande${userOrders.length > 1 ? 's' : ''} — ${totalSpent.toFixed(2)} € dépensés au total`;

    tbody.innerHTML = userOrders.length
      ? userOrders.map(o => `
        <tr>
          <td style="font-weight:700">#${o.id}</td>
          <td>${(o.items || []).length} article${(o.items || []).length > 1 ? 's' : ''}</td>
          <td style="font-weight:700;color:var(--rose-dark)">${Number(o.total).toFixed(2)} €</td>
          <td><span class="order-status status-${o.status}">${ORDER_STATUS_LABELS[o.status] || o.status}</span></td>
          <td style="font-size:.8rem;color:var(--text-light)">${formatDate(o.created_at)}</td>
        </tr>`).join('')
      : '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-light)">Aucune commande pour ce client</td></tr>';
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#d9534f">${e.message}</td></tr>`;
  }
}

// ─── Actions ──────────────────────────────────────────────
async function changeRole(userId, newRole) {
  try {
    await apiFetch(`/admin/users/${userId}/role`, { method: 'PUT', body: { role: newRole } });
    Toast.show(newRole === 'admin' ? '✅ Compte promu admin !' : '✅ Rôle retiré', 'success');
    loadUsers();
  } catch (e) { Toast.show(e.message, 'error'); }
}

function confirmDelete(userId, name) {
  deleteTarget = userId;
  document.getElementById('delete-modal-text').textContent =
    `Voulez-vous vraiment supprimer le compte de ${name} ? Cette action est irréversible.`;
  document.getElementById('delete-modal').style.display = 'flex';
}

function closeDeleteModal() {
  deleteTarget = null;
  document.getElementById('delete-modal').style.display = 'none';
}

document.getElementById('delete-confirm-btn').addEventListener('click', async () => {
  if (!deleteTarget) return;
  try {
    await apiFetch(`/admin/users/${deleteTarget}`, { method: 'DELETE' });
    closeDeleteModal();
    Toast.show('✅ Compte supprimé', 'success');
    loadUsers();
  } catch (e) { Toast.show(e.message, 'error'); closeDeleteModal(); }
});

// ─── Listeners contrôles ──────────────────────────────────
document.getElementById('search-input').addEventListener('input', applyFiltersAndSort);

// Filtres par chips
document.querySelectorAll('.filter-chip').forEach(btn => {
  btn.addEventListener('click', function() {
    const group = this.dataset.filter;
    document.querySelectorAll(`.filter-chip[data-filter="${group}"]`).forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    if (group === 'role')  filterRole  = this.dataset.val;
    if (group === 'email') filterEmail = this.dataset.val;
    applyFiltersAndSort();
  });
});

// Tri par colonnes
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const key = this.dataset.sort;
    if (sortState.key === key) {
      sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
    } else {
      sortState.key = key;
      sortState.dir = key === 'date' ? 'desc' : 'asc';
    }
    document.querySelectorAll('.sort-btn').forEach(b => { b.classList.remove('active','asc','desc'); });
    this.classList.add('active', sortState.dir);
    applyFiltersAndSort();
  });
});

// ─── Export XLS ──────────────────────────────────────────────
function exportXLS() {
  // Récupérer la liste courante filtrée/triée (même état que le tableau)
  const q = document.getElementById('search-input').value.toLowerCase();
  let list = allUsers.filter(u => {
    const matchSearch = !q
      || u.first_name.toLowerCase().includes(q)
      || u.last_name.toLowerCase().includes(q)
      || (u.username || '').toLowerCase().includes(q)
      || u.email.toLowerCase().includes(q);
    const matchRole  = !filterRole  || u.role === filterRole;
    const matchEmail = filterEmail === '' || String(u.email_verified) === filterEmail;
    return matchSearch && matchRole && matchEmail;
  });

  if (!list.length) { Toast.show('Aucun utilisateur à exporter', 'info'); return; }

  const rows = list.map(u => ({
    'ID':             u.id,
    'Prénom':         u.first_name,
    'Nom':            u.last_name,
    'Pseudo':         u.username || '',
    'Email':          u.email,
    'Rôle':           u.role === 'admin' ? 'Administrateur' : 'Utilisateur',
    'Email vérifié':  u.email_verified ? 'Oui' : 'Non',
    'Date inscription': u.created_at ? new Date(u.created_at).toLocaleDateString('fr-FR') : '',
  }));

  const ws   = XLSX.utils.json_to_sheet(rows);
  // Largeurs colonnes
  ws['!cols'] = [
    {wch:6},{wch:14},{wch:16},{wch:16},{wch:30},
    {wch:16},{wch:14},{wch:18}
  ];
  const wb   = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Utilisateurs');

  const date = new Date().toISOString().split('T')[0];
  const role  = filterRole  ? `_${filterRole}s`  : '';
  const email = filterEmail === '1' ? '_vérifiés' : filterEmail === '0' ? '_en-attente' : '';
  XLSX.writeFile(wb, `utilisateurs${role}${email}_${date}.xlsx`);
  Toast.show(`📥 ${list.length} utilisateur(s) exporté(s)`, 'success');
}

checkAdmin();
</script>
</body>
</html>
