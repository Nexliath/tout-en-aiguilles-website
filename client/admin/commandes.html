<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Google Tag Manager -->

  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-5M8NK6RH');</script>

  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commandes — Admin Tout en Aiguilles</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5M8NK6RH"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
<div id="admin-guard" style="display:none;position:fixed;inset:0;background:var(--cream);z-index:9999;align-items:center;justify-content:center">
  <div style="background:white;border-radius:24px;padding:40px;max-width:400px;width:90%;box-shadow:0 8px 40px rgba(122,92,72,.15)">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:3rem;margin-bottom:12px">🔐</div>
      <h2 style="margin-bottom:8px">Espace admin</h2>
      <p style="font-size:.875rem;color:var(--text-light)">Connectez-vous avec votre compte administrateur.</p>
    </div>
    <div class="form-group"><label class="form-label">Email</label><input type="email" id="guard-email" class="form-input" placeholder="victorine@..."></div>
    <div class="form-group"><label class="form-label">Mot de passe</label><input type="password" id="guard-password" class="form-input" placeholder="••••••••"></div>
    <div id="guard-error" style="display:none;color:#d9534f;font-size:.85rem;margin-bottom:12px;padding:8px 12px;background:#f8d7da;border-radius:8px"></div>
    <button id="guard-btn" class="btn btn-primary btn-block">Se connecter →</button>
  </div>
</div>

<div id="admin-content" class="admin-layout">
  <div id="admin-sidebar-mount"></div>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Gestion des commandes</h1>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="font-size:.85rem;color:var(--text-light)" id="order-count"></div>
        <button class="btn btn-secondary btn-sm" onclick="exportOrdersXLS()">📤 Exporter Excel</button>
      </div>
    </div>

    <!-- Recherche + dates -->
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <input type="text" id="order-search" class="form-input" placeholder="🔎 Client, email, n° commande…" style="max-width:260px" oninput="applyFilters()">
      <label style="font-size:.78rem;color:var(--text-light);display:flex;align-items:center;gap:6px">Du
        <input type="date" id="order-date-from" class="form-input" style="max-width:150px" onchange="applyFilters()">
      </label>
      <label style="font-size:.78rem;color:var(--text-light);display:flex;align-items:center;gap:6px">au
        <input type="date" id="order-date-to" class="form-input" style="max-width:150px" onchange="applyFilters()">
      </label>
      <button class="btn btn-ghost btn-sm" onclick="resetDateFilter()">✕ Réinitialiser dates</button>
    </div>

    <!-- Status filter tabs -->
    <div style="display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap">
      <button class="cat-chip active" onclick="filterStatus('', this)">Toutes</button>
      <button class="cat-chip" onclick="filterStatus('pending', this)">⏳ En attente</button>
      <button class="cat-chip" onclick="filterStatus('paid', this)">💳 Payées</button>
      <button class="cat-chip" onclick="filterStatus('shipped', this)">🚚 Expédiées</button>
      <button class="cat-chip" onclick="filterStatus('delivered', this)">✓ Livrées</button>
      <button class="cat-chip" onclick="filterStatus('cancelled', this)">✗ Annulées</button>
    </div>

    <!-- Order detail panel -->
    <div id="order-detail" style="display:none" class="admin-panel mb-lg">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px">
        <div>
          <div class="admin-panel-title" style="margin-bottom:4px" id="detail-title">Commande #</div>
          <span id="detail-status"></span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('order-detail').style.display='none'">✕ Fermer</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
        <div>
          <h4 style="margin-bottom:12px;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light)">Client</h4>
          <div id="detail-customer" style="font-size:.9rem;line-height:2"></div>
        </div>
        <div>
          <h4 style="margin-bottom:12px;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light)">Changer le statut</h4>
          <div style="display:flex;flex-wrap:wrap;gap:6px" id="status-buttons"></div>
        </div>
      </div>
      <div style="margin-top:20px">
        <h4 style="margin-bottom:12px;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light)">Articles commandés</h4>
        <div id="detail-items"></div>
        <div style="text-align:right;margin-top:12px;font-family:var(--font-title);font-size:1.2rem;font-weight:700;color:var(--rose-dark)" id="detail-total"></div>
      </div>
      <div id="detail-notes" style="display:none;margin-top:16px;padding:12px;background:var(--cream);border-radius:var(--radius)"></div>
      <div id="relay-change-section" style="display:none"></div>
    </div>

    <!-- Barre d'actions groupées -->
    <div id="bulk-bar" style="display:none;padding:10px 16px;background:var(--rose-pale);border:1px solid var(--border);border-bottom:none;border-radius:var(--radius-lg) var(--radius-lg) 0 0;align-items:center;gap:10px;flex-wrap:wrap">
      <span id="bulk-count" style="font-size:.82rem;font-weight:700;color:var(--rose-dark)"></span>
      <button class="btn btn-secondary btn-sm" onclick="bulkChangeStatus('paid')">💳 Marquer payées</button>
      <button class="btn btn-secondary btn-sm" onclick="bulkChangeStatus('shipped')">🚚 Marquer expédiées</button>
      <button class="btn btn-secondary btn-sm" onclick="bulkChangeStatus('delivered')">✓ Marquer livrées</button>
      <button class="btn btn-ghost btn-sm" onclick="clearOrderSelection()" style="margin-left:auto">Annuler la sélection</button>
    </div>

    <!-- Table -->
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th style="width:36px"><input type="checkbox" id="select-all-orders" onchange="toggleSelectAllOrders(this)"></th><th>#</th><th>Client</th><th>Articles</th><th>Total</th><th>Statut</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody id="orders-tbody">
          <tr><td colspan="8" style="text-align:center;padding:40px"><div class="spinner" style="margin:0 auto"></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="/assets/js/main.js"></script>
<script>
let allOrders = [];
let currentFilter = '';
let selectedOrderIds = new Set();

const STATUS = { pending:'En attente', paid:'Payée', shipped:'Expédiée', delivered:'Livrée', cancelled:'Annulée' };
const DELIVERY_LABEL = { home: '🏠 Domicile', relay: '📦 Point Relais', handover: '🤝 Remise en main propre' };
// Transitions logiques : seuls les statuts suivants sont proposés selon le statut actuel
const NEXT_STATUSES = {
  pending:   ['paid', 'cancelled'],
  paid:      ['shipped', 'cancelled'],
  shipped:   ['delivered', 'cancelled'],
  delivered: [],
  cancelled: ['pending'],
};

function checkAdmin() {
  const guard   = document.getElementById('admin-guard');
  const content = document.getElementById('admin-content');
  if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
    content.style.display = 'none';
    guard.style.display   = 'flex';
  } else {
    guard.style.display   = 'none';
    content.style.display = '';
    init();
  }
}

document.getElementById('guard-btn').addEventListener('click', function() {
  const email = document.getElementById('guard-email').value.trim();
  const password = document.getElementById('guard-password').value;
  const errEl = document.getElementById('guard-error');
  const btn = document.getElementById('guard-btn');
  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'Email et mot de passe requis'; errEl.style.display = ''; return; }
  btn.disabled = true; btn.textContent = '…';
  apiFetch('/auth/login', { method: 'POST', body: { email, password } })
    .then(data => {
      if (data.user.role !== 'admin') throw new Error('Ce compte n\'est pas administrateur.');
      Auth.save(data.token, data.user);
      checkAdmin();
    })
    .catch(e => {
      errEl.textContent = e.message; errEl.style.display = '';
      btn.disabled = false; btn.textContent = 'Se connecter →';
    });
});
document.getElementById('guard-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('guard-btn').click();
});

async function init() {
  await loadOrders();
}

async function loadOrders() {
  try {
    allOrders = await apiFetch('/orders');
    renderOrders(allOrders);
    document.getElementById('order-count').textContent = `${allOrders.length} commande${allOrders.length > 1 ? 's' : ''}`;
  } catch (e) {
    document.getElementById('orders-tbody').innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--text-light)">${e.message}</td></tr>`;
  }
}

function filterStatus(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.admin-main .cat-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const search = (document.getElementById('order-search')?.value || '').trim().toLowerCase();
  const from = document.getElementById('order-date-from')?.value;
  const to   = document.getElementById('order-date-to')?.value;

  let filtered = currentFilter ? allOrders.filter(o => o.status === currentFilter) : allOrders;

  if (search) {
    filtered = filtered.filter(o =>
      `${o.first_name} ${o.last_name}`.toLowerCase().includes(search) ||
      (o.email || '').toLowerCase().includes(search) ||
      String(o.id).includes(search)
    );
  }
  if (from) {
    const fromDate = new Date(from + 'T00:00:00');
    filtered = filtered.filter(o => new Date(o.created_at) >= fromDate);
  }
  if (to) {
    const toDate = new Date(to + 'T23:59:59');
    filtered = filtered.filter(o => new Date(o.created_at) <= toDate);
  }

  renderOrders(filtered);
}

function resetDateFilter() {
  document.getElementById('order-date-from').value = '';
  document.getElementById('order-date-to').value = '';
  applyFilters();
}

function exportOrdersXLS() {
  const search = (document.getElementById('order-search')?.value || '').trim().toLowerCase();
  const from = document.getElementById('order-date-from')?.value;
  const to   = document.getElementById('order-date-to')?.value;
  let list = currentFilter ? allOrders.filter(o => o.status === currentFilter) : allOrders;
  if (search) {
    list = list.filter(o =>
      `${o.first_name} ${o.last_name}`.toLowerCase().includes(search) ||
      (o.email || '').toLowerCase().includes(search) ||
      String(o.id).includes(search)
    );
  }
  if (from) { const f = new Date(from + 'T00:00:00'); list = list.filter(o => new Date(o.created_at) >= f); }
  if (to)   { const t = new Date(to + 'T23:59:59');   list = list.filter(o => new Date(o.created_at) <= t); }

  if (!list.length) { Toast.show('Aucune commande à exporter', 'info'); return; }

  const rows = list.map(o => ({
    'N°': o.id, 'Client': `${o.first_name} ${o.last_name}`, 'Email': o.email,
    'Articles': o.items.length, 'Total (€)': Number(o.total),
    'Statut': STATUS[o.status] || o.status,
    'Livraison': DELIVERY_LABEL[o.delivery_type] || o.delivery_type || '',
    'N° suivi': o.tracking_number || '',
    'Date': o.created_at ? new Date(o.created_at).toLocaleDateString('fr-FR') : '',
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:6},{wch:20},{wch:26},{wch:9},{wch:10},{wch:12},{wch:16},{wch:16},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Commandes');
  XLSX.writeFile(wb, `commandes_${new Date().toISOString().split('T')[0]}.xlsx`);
  Toast.show(`📤 ${list.length} commande(s) exportée(s)`, 'success');
}

function renderOrders(orders) {
  const tbody = document.getElementById('orders-tbody');
  if (!orders.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--text-light)">Aucune commande</td></tr>';
    updateOrderBulkBar();
    return;
  }
  tbody.innerHTML = orders.map(o => `
    <tr>
      <td><input type="checkbox" class="order-select" data-id="${o.id}" ${selectedOrderIds.has(o.id) ? 'checked' : ''} onchange="toggleOrderSelect(${o.id}, this.checked)"></td>
      <td style="font-weight:700">#${o.id}</td>
      <td>
        <div style="font-weight:700">${o.first_name} ${o.last_name}</div>
        <div style="font-size:.78rem;color:var(--text-light)">${o.email}</div>
      </td>
      <td>${o.items.length} article${o.items.length > 1 ? 's' : ''}</td>
      <td style="font-weight:700;color:var(--rose-dark)">${Number(o.total).toFixed(2)} €</td>
      <td><span class="order-status status-${o.status}">${STATUS[o.status] || o.status}</span></td>
      <td style="font-size:.8rem;color:var(--text-light)">${formatDate(o.created_at)}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="showDetail(${o.id})">Détails</button>
      </td>
    </tr>`).join('');
  updateOrderBulkBar();
}

// ─── Sélection multiple / statut groupé ───────────────────
function toggleOrderSelect(id, checked) {
  if (checked) selectedOrderIds.add(id); else selectedOrderIds.delete(id);
  updateOrderBulkBar();
}
function toggleSelectAllOrders(checkbox) {
  document.querySelectorAll('.order-select').forEach(cb => {
    cb.checked = checkbox.checked;
    const id = Number(cb.dataset.id);
    if (checkbox.checked) selectedOrderIds.add(id); else selectedOrderIds.delete(id);
  });
  updateOrderBulkBar();
}
function clearOrderSelection() {
  selectedOrderIds.clear();
  document.querySelectorAll('.order-select').forEach(cb => cb.checked = false);
  const selectAll = document.getElementById('select-all-orders');
  if (selectAll) selectAll.checked = false;
  updateOrderBulkBar();
}
function updateOrderBulkBar() {
  const bar = document.getElementById('bulk-bar');
  if (selectedOrderIds.size > 0) {
    bar.style.display = 'flex';
    document.getElementById('bulk-count').textContent = `${selectedOrderIds.size} commande${selectedOrderIds.size > 1 ? 's' : ''} sélectionnée${selectedOrderIds.size > 1 ? 's' : ''}`;
  } else {
    bar.style.display = 'none';
  }
}
async function bulkChangeStatus(status) {
  if (!selectedOrderIds.size) return;
  if (!confirm(`Changer le statut de ${selectedOrderIds.size} commande(s) vers "${STATUS[status]}" ?`)) return;
  try {
    const res = await apiFetch('/orders/bulk/status', { method: 'PUT', body: { ids: [...selectedOrderIds], status } });
    Toast.show(`✅ ${res.updated} commande(s) mise(s) à jour`, 'success');
    clearOrderSelection();
    await loadOrders();
  } catch (e) { Toast.show(e.message, 'error'); }
}

function showDetail(id) {
  const o = allOrders.find(x => x.id === id);
  if (!o) return;
  document.getElementById('order-detail').style.display = '';
  document.getElementById('detail-title').textContent = `Commande #${o.id}`;
  document.getElementById('detail-status').innerHTML = `<span class="order-status status-${o.status}">${STATUS[o.status]}</span>`;
  // Infos livraison
  let deliveryInfo = '';
  if (o.delivery_type === 'handover') {
    deliveryInfo = `<span style="color:var(--sage-dark)">🤝 Remise en main propre — Paris 8ème, Gare Saint-Lazare</span>`;
  } else if (o.delivery_type === 'relay' && o.relay_point) {
    deliveryInfo = `📦 Point Relais : <strong>${o.relay_point}</strong>`;
  } else {
    deliveryInfo = `🏠 ${o.address}, ${o.postal_code} ${o.city}, ${o.country}`;
  }
  const feeStr = Number(o.delivery_fee || 0) > 0 ? ` (+${Number(o.delivery_fee).toFixed(2)} €)` : ' (Gratuit)';
  const trackingStr = o.tracking_number ? `<br>📍 Suivi : <strong style="color:var(--sage-dark)">${o.tracking_number}</strong>` : '';

  document.getElementById('detail-customer').innerHTML = `
    <strong>${o.first_name} ${o.last_name}</strong><br>
    <a href="mailto:${o.email}" style="color:var(--rose-dark)">${o.email}</a><br>
    ${deliveryInfo}${feeStr}${trackingStr}`;

  // Transitions logiques seulement
  const nexts = NEXT_STATUSES[o.status] || [];
  document.getElementById('status-buttons').innerHTML = nexts.length === 0
    ? `<span style="font-size:.85rem;color:var(--text-light)">Statut final — aucune action disponible</span>`
    : nexts.map(s => `
      <button class="btn btn-sm ${s === 'cancelled' ? 'btn-ghost' : 'btn-secondary'}"
        onclick="${s === 'shipped' ? `promptTracking(${o.id})` : `changeStatus(${o.id}, '${s}')`}"
        style="${s === 'cancelled' ? 'color:#d9534f' : ''}">
        ${STATUS[s]}
      </button>`).join('');

  document.getElementById('detail-items').innerHTML = o.items.map(item => `
    <div style="display:flex;gap:12px;align-items:center;padding:10px;background:var(--cream);border-radius:8px;margin-bottom:6px">
      <div style="width:40px;height:40px;border-radius:6px;background:var(--cream-dark);display:flex;align-items:center;justify-content:center;font-size:1.2rem">
        ${item.image ? `<img src="${item.image}" style="width:100%;height:100%;object-fit:cover;border-radius:6px" onerror="this.innerHTML='🧶'">` : '🧶'}
      </div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:.875rem">${item.name}${item.variant_label ? ` <span style="font-weight:400;color:var(--rose-dark)">— ${item.variant_label}</span>` : ''}</div>
        <div style="font-size:.78rem;color:var(--text-light)">Qté : ${item.qty} × ${Number(item.price).toFixed(2)} €</div>
      </div>
      <div style="font-weight:700;color:var(--rose-dark)">${(item.qty * item.price).toFixed(2)} €</div>
    </div>`).join('');

  const deliveryFee = Number(o.delivery_fee || 0);
  document.getElementById('detail-total').innerHTML = deliveryFee > 0
    ? `Articles : ${(Number(o.total) - deliveryFee).toFixed(2)} € + Livraison : ${deliveryFee.toFixed(2)} € = <span style="color:var(--rose-dark)">Total : ${Number(o.total).toFixed(2)} €</span>`
    : `Total : ${Number(o.total).toFixed(2)} €`;

  if (o.notes) {
    document.getElementById('detail-notes').style.display = '';
    document.getElementById('detail-notes').innerHTML = `<strong>📝 Note :</strong> ${o.notes}`;
  } else {
    document.getElementById('detail-notes').style.display = 'none';
  }

  // Bouton changement point relais (si livraison relay)
  const relayChangeEl = document.getElementById('relay-change-section');
  if (o.delivery_type === 'relay') {
    relayChangeEl.style.display = '';
    relayChangeEl.innerHTML = `
      <div style="margin-top:16px;padding:12px 16px;background:var(--cream);border-radius:var(--radius);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span style="font-size:.85rem;color:var(--text-light);flex:1">Point relais actuel : <strong style="color:var(--text)">${o.relay_point || 'Non renseigné'}</strong></span>
        <button class="btn btn-secondary btn-sm" onclick="changeRelayPoint(${o.id})">📦 Modifier le point relais</button>
      </div>`;
  } else {
    relayChangeEl.style.display = 'none';
  }

  document.getElementById('order-detail').scrollIntoView({ behavior: 'smooth' });
}

async function changeStatus(id, status, tracking_number) {
  try {
    const body = { status };
    if (tracking_number !== undefined) body.tracking_number = tracking_number;
    await apiFetch(`/orders/${id}/status`, { method: 'PUT', body });
    Toast.show(`Statut mis à jour : ${STATUS[status]}`, 'success');
    await loadOrders();
    showDetail(id);
  } catch (e) { Toast.show(e.message, 'error'); }
}

function promptTracking(id) {
  const tracking = prompt('Numéro de suivi (optionnel — laisser vide si inconnu) :');
  if (tracking === null) return;
  changeStatus(id, 'shipped', tracking.trim() || '');
}

async function changeRelayPoint(id) {
  const o = allOrders.find(x => x.id === id);
  const current = o?.relay_point || '';
  const newRelay = prompt(`Nouveau point relais :\n(Ancien : ${current || 'non renseigné'})`, current);
  if (newRelay === null || newRelay.trim() === current.trim()) return;
  if (!newRelay.trim()) { Toast.show('Le point relais ne peut pas être vide', 'error'); return; }
  try {
    const res = await apiFetch(`/orders/${id}/relay-point`, { method: 'PUT', body: { relay_point: newRelay.trim() } });
    Toast.show(res.notified ? '✅ Point relais modifié — client notifié par email' : '✅ Point relais modifié (email non envoyé)', res.notified ? 'success' : 'info');
    await loadOrders();
    showDetail(id);
  } catch(e) { Toast.show(e.message, 'error'); }
}

checkAdmin();
</script>
</body>
</html>
